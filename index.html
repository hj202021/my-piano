<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나만의 88키 커스텀 피아노</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        h1 { margin-bottom: 5px; color: #ffc0cb; }
        p { color: #aaa; margin-bottom: 20px; font-size: 14px; }
        
        .piano-container {
            width: 85vw;
            height: 300px;
            background: #111;
            border: 4px solid #333;
            border-radius: 10px;
            overflow-x: auto;
            display: flex;
            align-items: flex-start;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .piano {
            display: flex;
            position: relative;
            height: 100%;
        }
        .key.white {
            width: 36px;
            height: 260px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            color: #333;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.05s;
            box-sizing: border-box;
            z-index: 1;
        }
        .key.white.active { background: #ffc0cb; }
        
        .key.black {
            width: 22px;
            height: 160px;
            background: #222;
            border-radius: 0 0 4px 4px;
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: #ffc0cb;
            font-size: 9px;
            cursor: pointer;
            user-select: none;
            transition: background 0.05s;
        }
        .key.black.active { background: #ff69b4; }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ffc0cb;
            color: #1a1a1a;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .settings-btn:hover { background: #ffb6c1; }

        .sidebar {
            position: absolute;
            top: 0;
            right: -360px;
            width: 320px;
            height: 100vh;
            background: #252525;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 90;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar.open { right: 0; }
        .sidebar h2 {
            color: #ffc0cb;
            margin-top: 40px;
            font-size: 18px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        
        .option-group {
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .option-group label { font-size: 14px; font-weight: bold; cursor: pointer; }

        .mapping-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }
        .mapping-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 5px;
            border-bottom: 1px solid #333;
        }
        .mapping-item label { font-size: 13px; color: #ddd; font-weight: bold; }
        .key-input {
            width: 80px;
            background: #111;
            border: 1px solid #555;
            color: #ffc0cb;
            text-align: center;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .key-input:focus { border-color: #ffc0cb; outline: none; background: #333; }
    </style>
</head>
<body>

    <button class="settings-btn" id="toggleSidebar">⚙️ 설정하기</button>

    <h1>🎹 Master 88-Key Custom Piano</h1>
    <p>저음이 웅장하고 풍성하게 울리도록 업그레이드된 피아노를 즐겨보세요!</p>

    <div class="piano-container">
        <div class="piano" id="piano"></div>
    </div>

    <div class="sidebar" id="sidebar">
        <h2>⚙️ 피아노 설정</h2>
        <div class="option-group">
            <label for="vibratoToggle">🌊 바이브레이션(떨림)</label>
            <input type="checkbox" id="vibratoToggle" style="width: 20px; height: 20px; cursor: pointer;">
        </div>

        <h2>🎹 키 매핑 (A0 ~ C8)</h2>
        <div class="mapping-list" id="mappingList"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const vibratoToggle = document.getElementById('vibratoToggle');

        // 진짜 그랜드 피아노 사운드 시뮬레이터 (저음역대 보강 및 필터 적용)
        function playPianoSound(freq, midi) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            const now = audioCtx.currentTime;
            
            // 1. 저음역대(C3 이하, MIDI 48 미만)로 갈수록 볼륨을 대폭 키워줍니다! (인간의 귀 보정 + 저음 파워)
            const lowBoost = midi < 48 ? (48 - midi) * 0.05 + 1.8 : 1.0;
            const baseVolume = 0.45 * lowBoost;

            // 2. 저음은 웅장하게 오래 울리고(잔향 김), 고음은 깔끔하게 끝나도록 설정
            const decayTime = 1.6 + (108 - midi) * 0.015;

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(baseVolume, now);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + decayTime);

            // 3. 로우패스 필터로 기계적인 차가운 쇳소리를 따뜻하고 부드러운 피아노 울림으로 변환
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(Math.min(freq * 5, 3500), now);

            masterGain.connect(filter);
            filter.connect(audioCtx.destination);

            // 4. 풍성한 그랜드 피아노 배음 구조 (Sawtooth + Triangle + Sub-Bass Sine)
            const osc1 = audioCtx.createOscillator(); // 타격감과 밝은 색채
            const osc2 = audioCtx.createOscillator(); // 미세 디튠 코러스감
            const osc3 = audioCtx.createOscillator(); // 저음역대 웅장한 서브 베이스

            osc1.type = 'sawtooth';
            osc2.type = 'triangle';
            osc3.type = 'sine';

            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 1.003, now);
            osc3.frequency.setValueAtTime(freq * 0.5, now); // 1옥타브 아래 저음 보강

            const g1 = audioCtx.createGain();
            const g2 = audioCtx.createGain();
            const g3 = audioCtx.createGain();

            g1.gain.value = 0.4;
            g2.gain.value = 0.4;
            // 저음 건반일수록 서브 베이스(g3)를 훨씬 빵빵하게 켜줍니다!
            g3.gain.value = midi < 50 ? 0.8 : 0.15; 

            osc1.connect(g1); g1.connect(masterGain);
            osc2.connect(g2); g2.connect(masterGain);
            osc3.connect(g3); g3.connect(masterGain);

            // 비브라토 효과
            let vibratoLFO = null;
            if (vibratoToggle.checked) {
                vibratoLFO = audioCtx.createOscillator();
                const vibratoGain = audioCtx.createGain();
                vibratoLFO.frequency.value = 5;
                vibratoGain.gain.value = 2.5;
                vibratoLFO.connect(vibratoGain);
                vibratoGain.connect(osc1.frequency);
                vibratoGain.connect(osc2.frequency);
                vibratoLFO.start(now);
                vibratoLFO.stop(now + decayTime);
            }

            osc1.start(now); osc1.stop(now + decayTime);
            osc2.start(now); osc2.stop(now + decayTime);
            osc3.start(now); osc3.stop(now + decayTime);
        }

        const piano = document.getElementById('piano');
        const mappingList = document.getElementById('mappingList');
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        const midiToKey = {};
        const keyToMidi = {};
        const pressedKeys = new Set();

        const defaultMappings = { 40: 'a', 42: 's', 44: 'd', 45: 'f', 47: 'g', 49: 'h', 51: 'j', 52: 'k' };
        for (let m in defaultMappings) {
            midiToKey[m] = defaultMappings[m];
            keyToMidi[defaultMappings[m]] = m;
        }

        let whiteKeyLeft = 0;
        const keyElements = {};
        const inputElements = {};

        for (let midi = 21; midi <= 108; midi++) {
            const noteIndex = (midi - 12) % 12;
            const noteName = noteNames[noteIndex];
            const octave = Math.floor((midi - 12) / 12);
            const fullName = `${noteName}${octave}`;
            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            const isBlack = noteName.includes('#');

            const keyEl = document.createElement('div');
            keyEl.classList.add('key');
            
            if (!isBlack) {
                keyEl.classList.add('white');
                keyEl.style.left = whiteKeyLeft + 'px';
                whiteKeyLeft += 36;
            } else {
                keyEl.classList.add('black');
                keyEl.style.left = (whiteKeyLeft - 11) + 'px';
            }

            keyEl.addEventListener('mousedown', () => {
                playPianoSound(freq, midi);
                keyEl.classList.add('active');
            });
            keyEl.addEventListener('mouseup', () => keyEl.classList.remove('active'));
            keyEl.addEventListener('mouseleave', () => keyEl.classList.remove('active'));

            keyElements[midi] = keyEl;
            piano.appendChild(keyEl);

            const item = document.createElement('div');
            item.classList.add('mapping-item');

            const label = document.createElement('label');
            label.innerText = fullName;

            const input = document.createElement('input');
            input.type = 'text';
            input.classList.add('key-input');
            input.placeholder = '키 입력...';
            input.value = midiToKey[midi] ? midiToKey[midi].toUpperCase() : '';
            input.readOnly = true;

            input.addEventListener('keydown', (e) => {
                e.preventDefault();
                const keyName = e.key.length === 1 ? e.key.toLowerCase() : e.key;
                
                if (keyToMidi[keyName]) {
                    const oldMidi = keyToMidi[keyName];
                    delete midiToKey[oldMidi];
                    if (inputElements[oldMidi]) inputElements[oldMidi].value = '';
                    updateKeyLabel(oldMidi);
                }

                midiToKey[midi] = keyName;
                keyToMidi[keyName] = midi;
                input.value = keyName.toUpperCase();
                updateKeyLabel(midi);
            });

            item.appendChild(label);
            item.appendChild(input);
            mappingList.appendChild(item);

            inputElements[midi] = input;
            updateKeyLabel(midi, fullName);
        }

        function updateKeyLabel(midi, fullNameOverride) {
            const el = keyElements[midi];
            const noteIndex = (midi - 12) % 12;
            const fullName = fullNameOverride || `${noteNames[noteIndex]}${Math.floor((midi - 12) / 12)}`;
            const assigned = midiToKey[midi] ? `[${midiToKey[midi].toUpperCase()}]` : '';

            if (el.classList.contains('white')) {
                el.innerHTML = `${fullName}<br><span>${assigned}</span>`;
            } else {
                el.innerHTML = `<span>${assigned}</span>`;
            }
        }

        const toggleBtn = document.getElementById('toggleSidebar');
        const sidebar = document.getElementById('sidebar');
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.classList.contains('key-input')) return;
            if (e.repeat) return;

            const keyName = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            const midi = keyToMidi[keyName];
            
            if (midi && keyElements[midi] && !pressedKeys.has(midi)) {
                pressedKeys.add(midi);
                const freq = 440 * Math.pow(2, (midi - 69) / 12);
                playPianoSound(freq, midi);
                keyElements[midi].classList.add('active');
            }
        });

        window.addEventListener('keyup', (e) => {
            if (document.activeElement.classList.contains('key-input')) return;

            const keyName = e.key.length === 1 ? e.key.toLowerCase() : e.key;
            const midi = keyToMidi[keyName];
            
            if (midi && keyElements[midi]) {
                pressedKeys.delete(midi);
                keyElements[midi].classList.remove('active');
            }
        });
    </script>
</body>
</html>
