<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나만의 88키 커스텀 피아노</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin-bottom: 5px; color: #ffc0cb; }
        p { color: #aaa; margin-bottom: 20px; font-size: 14px; }
        
        /* 피아노 건반 전체를 감싸는 가로 스크롤 박스 */
        .piano-container {
            width: 90vw;
            height: 300px;
            background: #111;
            border: 4px solid #333;
            border-radius: 10px;
            overflow-x: auto;
            display: flex;
            align-items: flex-start;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .piano {
            display: flex;
            position: relative;
            height: 100%;
        }
        /* 하얀 건반 스타일 */
        .key.white {
            width: 32px;
            height: 260px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            color: #333;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.05s;
            box-sizing: border-box;
            z-index: 1;
        }
        .key.white.active {
            background: #ffc0cb;
        }
        /* 검은 건반 스타일 */
        .key.black {
            width: 20px;
            height: 160px;
            background: #222;
            border-radius: 0 0 4px 4px;
            position: absolute;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            color: white;
            font-size: 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.05s;
        }
        .key.black.active {
            background: #ff69b4;
        }
    </style>
</head>
<body>

    <h1>🎹 Master 88-Key Web Piano</h1>
    <p>마우스로 건반을 누르거나, 아래 기본 지정된 키(A~L 등)를 눌러 연주해보세요!</p>

    <div class="piano-container">
        <div class="piano" id="piano"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
            setTimeout(() => osc.stop(), 800);
        }

        const piano = document.getElementById('piano');
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        // 컴퓨터 키보드 자판 매핑 샘플 (기본 홈 피치 영역)
        const keyMap = {
            'a': 40, 'w': 41, 's': 42, 'e': 43, 'd': 44, 'f': 45, 't': 46, 'g': 47, 'y': 48, 'h': 49, 'u': 50, 'j': 51, 'k': 52
        };
        const midiToKey = {};
        for (let k in keyMap) { midiToKey[keyMap[k]] = k; }

        let whiteKeyLeft = 0;
        const keyElements = {};

        // 88키 생성 (MIDI 번호 21(A0)부터 108(C8)까지)
        for (let midi = 21; midi <= 108; midi++) {
            const noteIndex = (midi - 12) % 12;
            const noteName = noteNames[noteIndex];
            const octave = Math.floor((midi - 12) / 12);
            const fullName = `${noteName}${octave}`;
            
            // 주파수 공식 계산
            const freq = 440 * Math.pow(2, (midi - 69) / 12);
            const isBlack = noteName.includes('#');

            const keyEl = document.createElement('div');
            keyEl.classList.add('key');
            
            // 키보드 단축키가 매핑되어 있다면 표시
            let label = midiToKey[midi] ? `[${midiToKey[midi].toUpperCase()}]` : '';

            if (!isBlack) {
                keyEl.classList.add('white');
                keyEl.style.left = whiteKeyLeft + 'px';
                keyEl.innerHTML = `${fullName}<br>${label}`;
                whiteKeyLeft += 32; // 하얀 건반 너비 만큼 이동
            } else {
                keyEl.classList.add('black');
                // 검은 건반 위치 조정
                keyEl.style.left = (whiteKeyLeft - 10) + 'px';
                keyEl.innerHTML = label;
            }

            // 마우스 클릭 이벤트
            keyEl.addEventListener('mousedown', () => {
                playSound(freq);
                keyEl.classList.add('active');
            });
            keyEl.addEventListener('mouseup', () => keyEl.classList.remove('active'));
            keyEl.addEventListener('mouseleave', () => keyEl.classList.remove('active'));

            keyElements[midi] = keyEl;
            piano.appendChild(keyEl);
        }

        // 컴퓨터 키보드 입력 이벤트
        window.addEventListener('keydown', (e) => {
            const m = keyMap[e.key.toLowerCase()];
            if (m && keyElements[m]) {
                const freq = 440 * Math.pow(2, (m - 69) / 12);
                playSound(freq);
                keyElements[m].classList.add('active');
            }
        });
        window.addEventListener('keyup', (e) => {
            const m = keyMap[e.key.toLowerCase()];
            if (m && keyElements[m]) {
                keyElements[m].classList.remove('active');
            }
        });
    </script>
</body>
</html>
